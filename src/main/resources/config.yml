messages:
  # Whether to show the action bar message
  showActionBar: true

  # The message that will be displayed in a player's hot bar while walking on a dirt path block (supports color codes with &)
  actionBar: "&eYou're moving faster!"

# Worlds where the speed effect is disabled, you can specify "disabledWorlds: []" to allow it on all worlds
disabledWorlds: []

# Preferred per-block configuration (takes priority if present)
# multiplier: 0.20 -> +20% movement speed
# Use Bukkit material names to specify blocks (see: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html)
blocks:
  - material: DIRT_PATH
    multiplier: 0.25
#  Additional examples:
#  - material: STONE_BRICKS
#    multiplier: 0.10
#  - material: PACKED_ICE
#    multiplier: 0.35

# -------------------------------------------------------------
# **Legacy fallback**
# if "blocks" is empty/missing: applies the same multiplier to all listed blocks.
# -------------------------------------------------------------
speed:
  # How fast do you want your players to be when stepping on the speed blocks
  multiplier: 0.20
speedBlocks:
  - DIRT_PATH
